<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The reset code is in this page's URL: never send it to another site. -->
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Reset password · FitnessApp</title>
  <style>
    :root { color-scheme: light dark; --bg: #ffffff; --fg: #1a1a1a; --muted: #5c5c5c; --btn: #0a7d3c; --btn-fg: #ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0a0a0a; --fg: #ededed; --muted: #a3a3a3; --btn: #39ff88; --btn-fg: #0a0a0a; } }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 420px; margin: 0 auto; padding: 64px 16px; text-align: center; }
    h1 { font-size: 1.5rem; }
    p { color: var(--muted); }
    .btn { display: inline-block; margin: 16px 0; padding: 14px 28px; border-radius: 12px; background: var(--btn); color: var(--btn-fg); font-weight: 600; text-decoration: none; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>Reset your password</h1>
    <div id="ok">
      <p>Tap below to finish in the app.</p>
      <a id="open" class="btn" href="fitnessapp://reset-password">Open FitnessApp</a>
      <p>Open this link on the phone where you asked for the reset, with FitnessApp installed.</p>
    </div>
    <div id="bad" hidden>
      <p>This link is incomplete. Request a new one from the app's login screen.</p>
    </div>
  </main>
  <script>
    // Supabase sends the reset email's link here (an https address, so mail
    // apps open it reliably) and this page hands the code to the app.
    // `to` lets a development build (Expo Go: exp://.../--/reset-password)
    // receive it; anything else falls back to the installed app.
    function appLink(href) {
      var url = new URL(href);
      var params = url.searchParams;
      var to = params.get('to');
      var allowed = /^fitnessapp:\/\/reset-password$/.test(to || '') ||
                    /^exps?:\/\/[^?#\s]+\/--\/reset-password$/.test(to || '');
      var target = allowed ? to : 'fitnessapp://reset-password';
      params.delete('to');
      var query = params.toString();
      return target + (query ? '?' + query : '') + url.hash;
    }

    var params = new URLSearchParams(location.search);
    var hash = new URLSearchParams(location.hash.slice(1));
    if (params.has('code') || params.has('error') || hash.has('error')) {
      var link = appLink(location.href);
      document.getElementById('open').href = link;
      location.replace(link);
    } else {
      document.getElementById('ok').hidden = true;
      document.getElementById('bad').hidden = false;
    }
  </script>
</body>
</html>
